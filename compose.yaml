services:
  postgres:
    image: postgres:16.4-alpine
    container_name: sipat-postgres
    environment:
      POSTGRES_DB: sipat
      POSTGRES_USER: sipat
      POSTGRES_PASSWORD: sipat_local_2026
    ports:
      - "5433:5432"
    volumes:
      - sipat_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sipat -d sipat"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sipat_postgres_data:
